name: CCI DMI PSAR Backtest Visual

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Backtest start date (YYYY-MM-DD)"
        required: false
        default: "2023-08-10"
      end_date:
        description: "Backtest end date (YYYY-MM-DD)"
        required: false
        default: "2026-08-10"
      fee_side:
        description: "Per-side proportional trading cost, e.g. 0.001"
        required: false
        default: "0.0"

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run CCI backtest
        env:
          MPLBACKEND: Agg
        run: |
          python kospi200_cci9_dmi14_psar_backtest_visual.py \
            --online \
            --start "${{ github.event.inputs.start_date }}" \
            --end "${{ github.event.inputs.end_date }}" \
            --fee-side "${{ github.event.inputs.fee_side }}" \
            --out output

      - name: Upload backtest results
        uses: actions/upload-artifact@v4
        with:
          name: cci-dmi-psar-backtest-results
          path: output/
          if-no-files-found: error
